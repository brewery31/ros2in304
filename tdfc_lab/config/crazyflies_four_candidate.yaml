    enabled: true
    default_topics:
      odom:
        frequency: 60
  firmware_params:
    commander:
      enHighLevel: 1
    stabilizer:
      estimator: 2
      controller: 2
    locSrv:
      extPosStdDev: 1e-3
      extQuatStdDev: 0.05
  broadcasts:
    num_repeats: 15
    delay_between_repeats_ms: 1
